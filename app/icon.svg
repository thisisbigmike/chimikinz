<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer pixel frame: 24px ink border & shadow -->
  <rect x="24" y="24" width="464" height="464" fill="#f7efe0" stroke="#16110f" stroke-width="24"/>
  <!-- Inner pixel grid background -->
  <rect x="48" y="48" width="416" height="416" fill="#fffaf0"/>
  
  <!-- Halo Gold Sparkles in corners -->
  <rect x="72" y="72" width="24" height="24" fill="#ffc61a"/>
  <rect x="416" y="72" width="24" height="24" fill="#ffc61a"/>
  <rect x="72" y="416" width="24" height="24" fill="#2e9e4f"/>
  <rect x="416" y="416" width="24" height="24" fill="#ffc61a"/>

  <!-- Halo Gold Ring on top -->
  <rect x="192" y="72" width="128" height="24" fill="#ffc61a" stroke="#16110f" stroke-width="12"/>

  <!-- Oddling Horns (Dark Ink) -->
  <polygon points="120,176 152,104 184,176" fill="#16110f"/>
  <polygon points="328,176 360,104 392,176" fill="#16110f"/>

  <!-- Oddling Hood / Body (Orange #f0601c) -->
  <rect x="112" y="168" width="288" height="264" fill="#f0601c" stroke="#16110f" stroke-width="20"/>

  <!-- Face Inner (Lilac Oddling skin) -->
  <rect x="152" y="208" width="208" height="168" fill="#a797d4" stroke="#16110f" stroke-width="16"/>

  <!-- Left Eye - Sparkly Star (Halo Gold) -->
  <rect x="180" y="248" width="48" height="48" fill="#ffc61a" stroke="#16110f" stroke-width="8"/>
  <rect x="196" y="240" width="16" height="64" fill="#ffc61a"/>
  <rect x="172" y="264" width="64" height="16" fill="#ffc61a"/>
  <rect x="196" y="264" width="16" height="16" fill="#fffaf0"/>

  <!-- Right Eye - Sparkly Star (Halo Gold) -->
  <rect x="284" y="248" width="48" height="48" fill="#ffc61a" stroke="#16110f" stroke-width="8"/>
  <rect x="300" y="240" width="16" height="64" fill="#ffc61a"/>
  <rect x="276" y="264" width="64" height="16" fill="#ffc61a"/>
  <rect x="300" y="264" width="16" height="16" fill="#fffaf0"/>

  <!-- Mouth with quirky tongue -->
  <rect x="232" y="336" width="48" height="12" fill="#16110f"/>
  <rect x="256" y="344" width="20" height="20" fill="#f0601c" stroke="#16110f" stroke-width="6"/>

  <!-- Clover Green Luck Charm on Hoodie -->
  <rect x="240" y="400" width="32" height="32" fill="#2e9e4f" stroke="#16110f" stroke-width="8"/>
</svg>